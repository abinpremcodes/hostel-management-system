{% extends "base.html" %}

{% block title %}Vacate Bed{% endblock %}

{% block content %}
<h2>Vacate Bed</h2>

<p>Are you sure you want to vacate <strong>{{ allocation.student }}</strong> from <strong>{{ allocation.bed }}</strong>?</p>

<form method="post">
    {% csrf_token %}
    <button type="submit" class="btn btn-warning">Yes, Vacate</button>
    <a href="{% url 'allocations:allocation_list' %}" class="btn btn-secondary">Cancel</a>
</form>
{% endblock %}
