{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>{% block title %}Hostel Management{% endblock %}</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
<div class="d-flex">
    <nav class="bg-dark text-white p-3" style="width: 220px; min-height: 100vh;">
        <h5 class="mb-4">🏠 HostelMS</h5>
        <a href="{% url 'dashboard:home' %}" class="d-block text-white text-decoration-none mb-2">Dashboard</a>
    </nav>

    <div class="flex-grow-1">
        <div class="d-flex justify-content-between align-items-center bg-white shadow-sm p-3">
            <div></div>
            {% if user.is_authenticated %}
            <div>
                <span class="me-3">{{ user.username }} ({{ user.get_role_display }})</span>
                <form method="post" action="{% url 'accounts:logout' %}" class="d-inline">
                    {% csrf_token %}
                    <button type="submit" class="btn btn-sm btn-outline-danger">Logout</button>
                </form>
            </div>
            {% endif %}
        </div>

        <div class="p-4">
            {% block content %}{% endblock %}
        </div>
    </div>
</div>
</body>
</html>
