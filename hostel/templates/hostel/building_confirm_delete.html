{% extends "base.html" %}

{% block title %}Delete Building{% endblock %}

{% block content %}
<h2>Delete Building</h2>

<p>Are you sure you want to delete <strong>{{ building.name }}</strong>? This will also delete all its Floors, Rooms, and Beds.</p>

<form method="post">
    {% csrf_token %}
    <button type="submit" class="btn btn-danger">Yes, Delete</button>
    <a href="{% url 'hostel:building_list' %}" class="btn btn-secondary">Cancel</a>
</form>
{% endblock %}
