{% extends "base.html" %}

{% block title %}Delete Room{% endblock %}

{% block content %}
<h2>Delete Room</h2>

<p>Are you sure you want to delete <strong>{{ room }}</strong>? This will also delete all its Beds.</p>

<form method="post">
    {% csrf_token %}
    <button type="submit" class="btn btn-danger">Yes, Delete</button>
    <a href="{% url 'hostel:room_list' %}" class="btn btn-secondary">Cancel</a>
</form>
{% endblock %}
