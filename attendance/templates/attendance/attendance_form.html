{% extends "base.html" %}

{% block title %}Mark Attendance{% endblock %}

{% block content %}

<style>
    .form-page {
        max-width: 850px;
        margin: 0 auto;
    }

    .form-header {
        margin-bottom: 24px;
    }

    .form-header h2 {
        font-weight: 700;
        color: var(--text);
        margin-bottom: 6px;
    }

    .form-header p {
        color: var(--muted);
        margin: 0;
    }

    .form-card {
        background: var(--card);
        border: 1px solid var(--border);
        border-radius: var(--radius);
        box-shadow: var(--shadow);
        padding: 30px;
    }

    .form-card form p {
        margin-bottom: 20px;
    }

    .form-card label {
        display: block;
        font-weight: 600;
        color: var(--text);
        margin-bottom: 8px;
    }

    .form-card input,
    .form-card select,
    .form-card textarea {
        width: 100%;
        padding: 11px 14px;
        border: 1px solid var(--border);
        border-radius: 10px;
        background: #fff;
        color: var(--text);
        font-family: inherit;
        font-size: 14px;
        transition: 0.2s ease;
    }

    .form-card input:focus,
    .form-card select:focus,
    .form-card textarea:focus {
        border-color: var(--primary);
        box-shadow: 0 0 0 3px var(--primary-light);
        outline: none;
    }

    .form-card .helptext {
        display: block;
        margin-top: 6px;
        font-size: 12px;
        color: var(--muted);
    }

    .form-card ul.errorlist {
        list-style: none;
        padding: 0;
        margin: 6px 0 0;
        color: var(--danger);
        font-size: 13px;
    }

    .form-actions {
        display: flex;
        gap: 10px;
        margin-top: 28px;
        padding-top: 20px;
        border-top: 1px solid var(--border);
    }

    .save-btn {
        display: inline-flex;
        align-items: center;
        gap: 8px;
        padding: 10px 18px;
        border: none;
        border-radius: 10px;
        background: var(--primary);
        color: #fff;
        font-weight: 600;
        text-decoration: none;
        transition: 0.2s ease;
    }

    .save-btn:hover {
        background: var(--primary-dark);
        color: #fff;
        transform: translateY(-1px);
    }

    .back-btn {
        display: inline-flex;
        align-items: center;
        gap: 8px;
    }

    @media (max-width: 576px) {
        .form-card {
            padding: 20px;
        }

        .form-actions {
            flex-direction: column;
        }

        .form-actions .btn,
        .form-actions .save-btn {
            width: 100%;
            justify-content: center;
        }
    }
</style>

<div class="form-page">

    <div class="form-header">
        <a href="{% url 'attendance:attendance_list' %}" class="back-btn">
            <i class="bi bi-arrow-left"></i>
            Back to Attendance
        </a>

        <h2 class="mt-3">
            <i class="bi bi-calendar-check me-2"></i>
            Mark Attendance
        </h2>

        <p>Record attendance for a student.</p>
    </div>

    <div class="form-card">

        <form method="post">
            {% csrf_token %}

            {{ form.as_p }}

            <div class="form-actions">

                <button type="submit" class="save-btn">
                    <i class="bi bi-check-lg"></i>
                    Save Attendance
                </button>

                <a href="{% url 'attendance:attendance_list' %}"
                   class="btn btn-light border">
                    Cancel
                </a>

            </div>

        </form>

    </div>

</div>

{% endblock %}
