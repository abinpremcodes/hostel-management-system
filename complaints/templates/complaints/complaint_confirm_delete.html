{% extends "base.html" %}

{% block title %}Delete Complaint{% endblock %}

{% block content %}
<h2>Delete Complaint</h2>

<p>Are you sure you want to delete "<strong>{{ complaints.title }}</strong>"?</p>

<form method="post">
    {% csrf_token %}
    <button type="submit" class="btn btn-danger">Yes, Delete</button>
    <a href="{% url 'complaints:complaint_list' %}" class="btn btn-secondary">Cancel</a>
</form>
{% endblock %}
