{% extends "base.html" %}

{% block title %}Check Out Visitor{% endblock %}

{% block content %}
<h2>Check Out Visitor</h2>

<p>Confirm that <strong>{{ visitor.visitor_name }}</strong> is leaving now?</p>

<form method="post">
    {% csrf_token %}
    <button type="submit" class="btn btn-warning">Yes, Check Out</button>
    <a href="{% url 'visitors:visitor_list' %}" class="btn btn-secondary">Cancel</a>
</form>
{% endblock %}
