{% extends "base.html" %}

{% block title %}Add Student{% endblock %}

{% block content %}
<h2>Add Student</h2>

<form method="post">
    {% csrf_token %}

    <h5 class="mt-3">Login Details</h5>
    {{ user_form.as_p }}

    <h5 class="mt-3">Student Details</h5>
    {{ profile_form.as_p }}

    <button type="submit" class="btn btn-dark mt-2">Save</button>
</form>
{% endblock %}
