<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Login - Hostel Management</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="d-flex align-items-center justify-content-center" style="min-height: 100vh; background-color: #1e2a38;">

<div class="card p-4" style="width: 350px;">
    <h4 class="text-center mb-3">🏠 Hostel Management</h4>

    {% if form.errors %}
        <div class="alert alert-danger py-2">Invalid username or password.</div>
    {% endif %}

    <form method="post">
        {% csrf_token %}
        <div class="mb-3">
            <label class="form-label">Username</label>
            
            <input type="text" name="username" class="form-control" required minlength="3">

        </div>
        <div class="mb-3">
            <label class="form-label">Password</label>

            
            <input type="password" name="password" class="form-control" required minlength="4">

        </div>
        <button type="submit" class="btn btn-dark w-100">Login</button>
    </form>
</div>

</body>
</html>
