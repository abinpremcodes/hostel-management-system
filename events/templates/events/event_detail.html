
{% extends "base.html" %}

{% block title %}{{ event.title }}{% endblock %}

{% block content %}

<div class="mb-4">
    <a href="{% url 'events:my_events' %}"
       class="btn btn-outline-secondary btn-sm">
        <i class="bi bi-arrow-left me-1"></i> Back to My Events
    </a>
</div>

<div class="card border-0 shadow-sm">
    <div class="card-body p-4 p-md-5">

        <div class="student-action-icon mb-3">
            <i class="bi bi-calendar-event"></i>
        </div>

        <h2 class="fw-bold mb-3">{{ event.title }}</h2>

        <div class="row g-3 mb-4">
            <div class="col-md-4">
                <div class="p-3 rounded bg-light">
                    <div class="text-muted small mb-1">Date</div>
                    <div class="fw-semibold">
                        <i class="bi bi-calendar3 me-2"></i>
                        {{ event.date|date:"l, d F Y" }}
                    </div>
                </div>
            </div>

            <div class="col-md-4">
                <div class="p-3 rounded bg-light">
                    <div class="text-muted small mb-1">Time</div>
                    <div class="fw-semibold">
                        <i class="bi bi-clock me-2"></i>
                        {{ event.time|time:"h:i A" }}
                    </div>
                </div>
            </div>

            <div class="col-md-4">
                <div class="p-3 rounded bg-light">
                    <div class="text-muted small mb-1">Venue</div>
                    <div class="fw-semibold">
                        <i class="bi bi-geo-alt me-2"></i>
                        {{ event.venue }}
                    </div>
                </div>
            </div>
        </div>

        <h5 class="fw-bold">About this event</h5>

        <div class="text-muted" style="white-space: pre-line;">
            {{ event.description }}
        </div>

    </div>
</div>

{% endblock %}
